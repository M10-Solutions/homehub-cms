name: HomeHub QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and run strict regression
        run: docker compose --profile qa run --rm --no-deps --build qa
      - name: Check locked dependencies and audit
        run: |
          test -f composer.lock || { echo 'Publication blocked: composer.lock missing'; exit 1; }
          docker run --rm --entrypoint composer homehub-local:latest validate --strict
          docker run --rm --entrypoint composer homehub-local:latest audit --locked --no-dev
