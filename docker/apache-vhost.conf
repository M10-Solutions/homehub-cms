<VirtualHost *:80>
    ServerName homehub.local
    DocumentRoot /var/www/homehub/src

    <Directory /var/www/homehub/src>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Private PHP source and configuration must never be served directly.
    <Directory /var/www/homehub/src/lib>
        Require all denied
    </Directory>
    <Directory /var/www/homehub/src/config>
        Require all denied
    </Directory>
    <FilesMatch "^(\.htaccess|\.htpasswd)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/homehub-error.log
    CustomLog ${APACHE_LOG_DIR}/homehub-access.log combined
</VirtualHost>
